<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="estilo/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caacupe+One&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">

    <title>Lista</title>

    
</head>
<body>
    <section class="pagina">
        
        <h1><strong>Lista de tarefas:</strong></h1>
        <hr>

        <div class="preenchimento">
            <form action="" onsubmit="salvar()">
                <fieldset>
                    <legend><strong>Nova Tarefa:</strong></legend>

                    <div class="row">
                        <div class="col">
                            <label for="tarefa"><strong>Tarefa</strong></label>
                            <input type="text" id="tarefa">
                        </div>

                        <div class="col">
                            <label><strong>Prioridade:</strong></label> 

                            <div class="radio-item">
                                <input type="radio" id="alta" name="prioridade" value="alta">
                                <label for="alta">ALTA</label>
                            </div>
                            
                            <div class="radio-item">
                                <input type="radio" id="media" name="prioridade" value="media">
                                <label for="media">MÉDIA</label>
                            </div>
                            
                            <div class="radio-item">
                                <input type="radio" id="baixa" name="prioridade" value="baixa">
                                <label for="baixa">BAIXA</label>
                            </div>
                        </div>

                        <div class="col">
                            <label for="categoria"><strong>Categoria:</strong></label>
                            <select name="categoria" id="categoria">
                                <option value="lazer">Lazer</option>
                                <option value="estudo">Estudo</option>
                                <option value="trabalho">Trabalho</option>
                                <option value="outro">Outro</option>
                            </select>
                        </div>

                        <div class="">
                            <br>
                            <button class="bnt" type="submit">Adicionar</button>
                        </div>
                    </div>
                </fieldset>
            </form>

        </div>
        <hr>

        <table class="lista">
            <thead>
                <tr>
                    <th>Tarefa</th>
                    <th>Prioridade</th>
                    <th>Categoria</th>
                    <th>Ações</th>
                </tr>
            </thead>

            <tbody class="dadosTarefa" id="dadosTarefa">

            </tbody>
        </table>
    </section>

    <script>

        function salvar(){
            event.preventDefault();
            
            const TAREFA = document.getElementById("tarefa");
            const CATEGORIA = document.getElementById("categoria");
            const PRIORIDADE = document.querySelector('input[name="prioridade"]:checked');

            if (TAREFA.value === "" || !PRIORIDADE){
                alert("'Tarefa' ou 'Prioridade' não pode estar vazio");
                return;
            }

            const novaLinha = document.createElement("tr");

            const tdTarefa = document.createElement("td");
            tdTarefa.textContent = TAREFA.value;

            const tdPrioridade = document.createElement("td");
            tdPrioridade.textContent = PRIORIDADE.value;

            const tdCategoria = document.createElement("td");
            tdCategoria.textContent = CATEGORIA.value;

            const tdAcoes = document.createElement("td");

            const btnConcluir = document.createElement("button");
            btnConcluir.textContent = "Concluir";
            btnConcluir.type = "button";
            btnConcluir.style.marginRight = "5px";

            const spanData = document.createElement("span");
            spanData.classList.add("data-conclusao");

            btnConcluir.onclick = function(){
                novaLinha.classList.toggle("concluida");

                if(novaLinha.classList.contains("concluida")){
                    const agora =  new Date()
                    const dataFormatada = agora.toLocaleDateString() + " às " + agora.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit'});
                    spanData.textContent = dataFormatada;
                } else{
                    spanData.textContent = ""
                }
            }

            const btnExcluir = document.createElement("button");
            btnExcluir.textContent = "Excluir";
            btnExcluir.type = "button";

            btnExcluir.classList.add("btn-excluir");

            btnExcluir.onclick = function(){
                novaLinha.remove();
            }

            tdAcoes.appendChild(btnConcluir);
            tdAcoes.appendChild(btnExcluir);
            tdAcoes.appendChild(spanData);

            novaLinha.appendChild(tdTarefa);
            novaLinha.appendChild(tdPrioridade);
            novaLinha.appendChild(tdCategoria);
            novaLinha.appendChild(tdAcoes);

            const corpoTabela = document.getElementById("dadosTarefa");
            corpoTabela.appendChild(novaLinha);

            TAREFA.value = "";



        }
    </script>
</body>
</html>
